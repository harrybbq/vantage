<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vantage</title>
    <meta name="description" content="Your goals, habits, money, trips and health in one place." />

    <!-- Link previews (iMessage, WhatsApp, Slack, X, LinkedIn…). The
         image is a static 1200×630 PNG in public/; its URL must be
         absolute or most scrapers ignore it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vantage" />
    <meta property="og:title" content="Vantage" />
    <meta property="og:description" content="Your goals, habits, money, trips and health in one place." />
    <meta property="og:url" content="https://vantagevision.netlify.app/" />
    <meta property="og:image" content="https://vantagevision.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vantage — your goals, habits, money, trips and health in one place." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vantage" />
    <meta name="twitter:description" content="Your goals, habits, money, trips and health in one place." />
    <meta name="twitter:image" content="https://vantagevision.netlify.app/og-image.png" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme colour (Android Chrome address bar + task switcher) -->
    <meta name="theme-color" content="#1a7a4a" />

    <!-- Standard favicon -->
    <link rel="icon" type="image/png" href="/icon-192.png?v=2" />

    <!-- ── iOS / Safari PWA meta tags ── -->
    <!-- Hides Safari UI when launched from home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Status bar style: default | black | black-translucent -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- App name shown below the icon on iOS -->
    <meta name="apple-mobile-web-app-title" content="Vantage" />
    <!-- Touch icon (used for Add to Home Screen on iOS) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <!-- Splash screen colour on iOS -->
    <meta name="msapplication-TileColor" content="#1a7a4a" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/assets/index-8oIG1XFA.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-rV9khZ94.css">
  </head>
  <body>
    <!-- Boot fallback.
         React replaces these children on mount, so this is only ever
         visible while the bundle loads or when the app FAILED to start.
         Without it, any error before the first render — a module-level
         throw, a chunk that didn't download, a parse error on an older
         browser — presents as a completely blank screen with nothing to
         report and nothing to tap.

         The markup holds no status text of its own: boot-fallback.js
         writes the loading label and, only on a real failure, the
         boot-error panel. A crawler or a browser without JavaScript
         reads the noscript sentence instead of an error that never
         happened (2026-10-17). -->
    <div id="root">
      <div id="boot-fallback" style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#8a8a85;background:#141412;">
        <noscript>
          <div style="max-width:30em;font-family:'DM Sans',system-ui,sans-serif;line-height:1.6;">
            <p style="margin:0 0 8px;font-size:22px;font-weight:600;color:#f4f2ec;">Vantage</p>
            <p style="margin:0 0 12px;font-size:15px;color:#c9c9c2;">Your goals, habits, money, trips and health in one place.</p>
            <p style="margin:0;font-size:13px;color:#8a8a85;">Vantage needs JavaScript turned on to run.</p>
          </div>
        </noscript>
      </div>
    </div>
    <!-- Surfaces a boot failure on the screen above. A file rather than
         an inline script so the CSP needs no 'unsafe-inline' (item 60).
         Classic and blocking on purpose: it must be listening before the
         module below evaluates — no defer/async/type=module. -->
    <script src="/boot-fallback.js"></script>
  </body>
</html>
