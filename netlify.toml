[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Netlify's secrets scanner (enabled by default since 2024) blocks
  # deploys when it finds env-var values in the build output. That's
  # the right behavior for server secrets, but VITE_* vars are
  # designed to be bundled into the client — and Supabase publishable
  # keys are explicitly safe to expose (they're gated by RLS on every
  # table). Whitelist the keys whose presence in dist/ is intentional.
  #
  # Add any new VITE_* var here when you introduce one. NEVER add
  # server-side secrets (SUPABASE_SERVICE_ROLE_KEY, FCM_*, etc.) —
  # those should never appear in the bundle in the first place.
  #
  # VITE_OWNER_EMAIL used to be the client-side UI gate (useIsOwner);
  # the client no longer reads it, but some functions still fall back to
  # it for OWNER_EMAIL. An email identifier, not a credential.
  #
  # SUPABASE_URL is the server-side twin of VITE_SUPABASE_URL — same
  # value (the public project endpoint), used by the Netlify functions
  # via process.env. The scanner finds that URL in the client bundle
  # (put there legitimately by the VITE_ twin) and attributes it to the
  # SUPABASE_URL key, so that key must be omitted too. The URL is a
  # public endpoint, NOT a secret — the real secret is
  # SUPABASE_SERVICE_ROLE_KEY, which never enters the bundle and stays
  # scanned.
  #
  # VITE_API_BASE (native build's function origin, the public site URL —
  # also hard-coded as DEFAULT_API_BASE in src/lib/native/apiUrl.js) and
  # VITE_NATIVE_BUILD (a "true"/"false" build flag) came in with the
  # native work; both are public by design and would otherwise trip the
  # value scan the moment they are set in the dashboard.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_REVENUECAT_API_KEY_IOS,VITE_REVENUECAT_API_KEY_ANDROID,VITE_OWNER_EMAIL,VITE_API_BASE,VITE_NATIVE_BUILD,SUPABASE_URL"

  # Smart detection scans for things that LOOK like secrets by
  # pattern (long base64 strings, JWT shapes, keys with known
  # provider prefixes). It fires false positives on the Supabase
  # `sb_publishable_*` key format and on hashed JS bundle filenames
  # — value-based scanning above is enough for our setup, so we
  # turn smart detection off. Keep an eye on this if you add new
  # hardcoded credentials anywhere; smart detection would catch them.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

  # Belt-and-braces: tell the scanner to skip the source paths where
  # third-party SDK code (and the .env.example file) contains strings
  # that pattern-match secret-looking shapes but aren't real secrets.
  # node_modules and dist are scanned by default; most false positives
  # come from there. .env.example holds variable names with empty
  # values, also harmless.
  SECRETS_SCAN_OMIT_PATHS = ".env.example,node_modules/**"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Headers = "Content-Type"

# ── Security headers ─────────────────────────────────────────────────
# Applied to every response. These were previously absent entirely.
[[headers]]
  for = "/*"
  [headers.values]
    # Clickjacking. Matters more now the app is heading for app stores,
    # where a webview wrapper shouldn't be frameable by anyone else.
    #
    # SAMEORIGIN, not DENY. The original reason is gone — the owner
    # Rotation page used to iframe /schedule/shift-rotation-2026.html
    # and DENY blocked even that same-origin frame; that page is now a
    # React tab (Upgrade → Rotation) and nothing in the app frames
    # itself any more. Kept at SAMEORIGIN because tightening to DENY is
    # a change to how the Capacitor shell may embed the site, and that
    # deserves its own test rather than riding along with a refactor.
    #
    # Still worth knowing: netlify.toml takes precedence over
    # public/_headers when both set a header, so the two must agree or
    # the _headers entry is silently dead. Keep them in step.
    #
    # Cross-origin embedding stays blocked either way, which is the
    # clickjacking protection that actually matters.
    X-Frame-Options = "SAMEORIGIN"
    # Stop the browser second-guessing declared content types.
    X-Content-Type-Options = "nosniff"
    # Don't leak the page path (which can name a section) to third
    # parties; same-origin still gets the full URL.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # No feature in the app needs these. The camera IS used for food
    # scanning, so it stays allowed for our own origin.
    Permissions-Policy = "geolocation=(), microphone=(), payment=(), usb=(), camera=(self)"
    # Two years, preload-eligible. Netlify terminates TLS and there is
    # no plain-HTTP surface to lock ourselves out of.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # CSP ships in REPORT-ONLY first, deliberately.
    #
    # A wrong CSP is indistinguishable from an outage: the app simply
    # stops working, for everyone, and the only clue is the console.
    # This policy is a considered guess — inline styles are everywhere
    # (framer-motion writes them, and the codebase uses style={{}}
    # widely), item images come from arbitrary retailer domains, and
    # backgrounds are data: URIs. Report-Only proves that out against
    # real traffic without risking a white screen.
    #
    # Promote to Content-Security-Policy once the violation reports are
    # quiet. It is defence-in-depth for the innerHTML rendering in the
    # hub, which is now escaped but is still string-built HTML.
    #
    # frame-ancestors is 'self', matching X-Frame-Options above — it
    # would supersede that header once this policy is enforced, so
    # leaving it at 'none' would have re-broken the Rotation page the
    # day the CSP was promoted.
    # ── 2026-09-30 (item 60): made enforceable, still Report-Only ──
    #
    # • Reports go to netlify/functions/csp-report (one compact log line
    #   per violation). `report-uri` for Safari/Firefox, `report-to` +
    #   the Reporting-Endpoints header below for Chromium. Without an
    #   endpoint, "promote once quiet" could never be observed.
    # • No inline script left in index.html: the boot fallback moved to
    #   /boot-fallback.js and its onclick became a listener, so
    #   script-src needs no 'unsafe-inline'.
    # • Google Fonts: the stylesheet (fonts.googleapis.com, style-src)
    #   and the font files it points at (fonts.gstatic.com, font-src).
    # • connect-src lists only what the BROWSER calls: Supabase (REST,
    #   auth, storage, realtime), the GitHub hub widget, and the site's
    #   own origin by name — the native shell's apiUrl() base, harmless
    #   on the web where it is also 'self'. Open-Meteo, Frankfurter,
    #   ipwho.is and Last.fm were listed here but are only called by the
    #   weather/destination-brief functions, server-side; dropped.
    # • img-src stays `https:` — retailer images, Google's favicon
    #   service (food BrandMark), YouTube thumbnails (i.ytimg.com) and
    #   Supabase Storage all arrive from there, and the retailer set is
    #   open-ended.
    #
    # Known before enforcing (not fixed here):
    #   – src/lib/career/runner.js compiles code with `new Function` in a
    #     blob: Worker, which inherits this policy → needs 'unsafe-eval'
    #     in script-src (owner-only Upgrade → Career; compiled out of
    #     native). Enforce without it and that runner breaks.
    #   – style-src keeps 'unsafe-inline': React style={{}} and
    #     framer-motion write inline styles everywhere.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.github.com https://vantagevision.netlify.app; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri /.netlify/functions/csp-report; report-to csp-endpoint"
    # The named group `report-to` points at. Relative URLs resolve
    # against the page's origin.
    Reporting-Endpoints = 'csp-endpoint="/.netlify/functions/csp-report"'

# The service worker must never be cached, or a stale one can pin
# clients to an old build — the failure mode behind the 2026-05-03
# incident.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── Scheduled Functions ──────────────────────────────────────────────
# push-dispatch sweeps the notifications_queue every minute. Cheap —
# the function returns immediately when the queue is empty.
[functions."push-dispatch"]
  schedule = "* * * * *"

# snapshot-ratings writes one rating snapshot per opted-in user per day.
# Powers the leaderboard's weekly-climb metric (current_ovr − snap_ovr).
# 03:00 UTC = low-traffic window.
[functions."snapshot-ratings"]
  schedule = "0 3 * * *"

# whoop-cron passively syncs each connected account's WHOOP data into
# their state. 06:00 UTC = overnight recovery/sleep are finalised and
# the app is closed, so the server-side merge can't race a client save.
[functions."whoop-cron"]
  schedule = "0 6 * * *"

# oura-cron does the same for Oura rings, half an hour later. The stagger
# is deliberate: an account with BOTH devices would otherwise have two
# functions read-modify-writing the same state blob at once, and the
# state save is a whole-object PATCH — overlapping writes are a lost
# update, not a merge.
[functions."oura-cron"]
  schedule = "30 6 * * *"

# settle-leagues closes the group week: scores every group, writes the
# result, promotes and relegates, and records Monday's coin payouts.
# 00:05 Monday UTC — before the 03:00 snapshot, so the week is measured
# against last Monday's baseline rather than today's fresh one. Moving
# either of these two crons without the other scores the week against
# the wrong end of itself.
[functions."settle-leagues"]
  schedule = "5 0 * * 1"
