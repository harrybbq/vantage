[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Netlify's secrets scanner (enabled by default since 2024) blocks
  # deploys when it finds env-var values in the build output. That's
  # the right behavior for server secrets, but VITE_* vars are
  # designed to be bundled into the client — and Supabase publishable
  # keys are explicitly safe to expose (they're gated by RLS on every
  # table). Whitelist the keys whose presence in dist/ is intentional.
  #
  # Add any new VITE_* var here when you introduce one. NEVER add
  # server-side secrets (SUPABASE_SERVICE_ROLE_KEY, FCM_*, etc.) —
  # those should never appear in the bundle in the first place.
  #
  # VITE_OWNER_EMAIL is a client-side UI gate (useIsOwner) — it's an
  # email identifier bundled on purpose, not a credential.
  #
  # SUPABASE_URL is the server-side twin of VITE_SUPABASE_URL — same
  # value (the public project endpoint), used by the Netlify functions
  # via process.env. The scanner finds that URL in the client bundle
  # (put there legitimately by the VITE_ twin) and attributes it to the
  # SUPABASE_URL key, so that key must be omitted too. The URL is a
  # public endpoint, NOT a secret — the real secret is
  # SUPABASE_SERVICE_ROLE_KEY, which never enters the bundle and stays
  # scanned.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_REVENUECAT_API_KEY_IOS,VITE_REVENUECAT_API_KEY_ANDROID,VITE_OWNER_EMAIL,SUPABASE_URL"

  # Smart detection scans for things that LOOK like secrets by
  # pattern (long base64 strings, JWT shapes, keys with known
  # provider prefixes). It fires false positives on the Supabase
  # `sb_publishable_*` key format and on hashed JS bundle filenames
  # — value-based scanning above is enough for our setup, so we
  # turn smart detection off. Keep an eye on this if you add new
  # hardcoded credentials anywhere; smart detection would catch them.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

  # Belt-and-braces: tell the scanner to skip the source paths where
  # third-party SDK code (and the .env.example file) contains strings
  # that pattern-match secret-looking shapes but aren't real secrets.
  # node_modules and dist are scanned by default; most false positives
  # come from there. .env.example holds variable names with empty
  # values, also harmless.
  SECRETS_SCAN_OMIT_PATHS = ".env.example,node_modules/**"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Headers = "Content-Type"

# ── Security headers ─────────────────────────────────────────────────
# Applied to every response. These were previously absent entirely.
[[headers]]
  for = "/*"
  [headers.values]
    # Clickjacking. Matters more now the app is heading for app stores,
    # where a webview wrapper shouldn't be frameable by anyone else.
    #
    # SAMEORIGIN, not DENY. DENY blocks same-origin framing too, which
    # broke the owner Rotation page — it renders
    # /schedule/shift-rotation-2026.html in a same-origin iframe, and
    # Firefox refused it outright. public/_headers already said
    # SAMEORIGIN for this exact reason, but netlify.toml takes
    # precedence over _headers when both set a header, so DENY won and
    # the note in _headers had no effect. Keep the two in step.
    #
    # Cross-origin embedding stays blocked, which is the clickjacking
    # protection that actually matters.
    X-Frame-Options = "SAMEORIGIN"
    # Stop the browser second-guessing declared content types.
    X-Content-Type-Options = "nosniff"
    # Don't leak the page path (which can name a section) to third
    # parties; same-origin still gets the full URL.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # No feature in the app needs these. The camera IS used for food
    # scanning, so it stays allowed for our own origin.
    Permissions-Policy = "geolocation=(), microphone=(), payment=(), usb=(), camera=(self)"
    # Two years, preload-eligible. Netlify terminates TLS and there is
    # no plain-HTTP surface to lock ourselves out of.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # CSP ships in REPORT-ONLY first, deliberately.
    #
    # A wrong CSP is indistinguishable from an outage: the app simply
    # stops working, for everyone, and the only clue is the console.
    # This policy is a considered guess — inline styles are everywhere
    # (framer-motion writes them, and the codebase uses style={{}}
    # widely), item images come from arbitrary retailer domains, and
    # backgrounds are data: URIs. Report-Only proves that out against
    # real traffic without risking a white screen.
    #
    # Promote to Content-Security-Policy once the violation reports are
    # quiet. It is defence-in-depth for the innerHTML rendering in the
    # hub, which is now escaped but is still string-built HTML.
    #
    # frame-ancestors is 'self', matching X-Frame-Options above — it
    # would supersede that header once this policy is enforced, so
    # leaving it at 'none' would have re-broken the Rotation page the
    # day the CSP was promoted.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.open-meteo.com https://archive-api.open-meteo.com https://geocoding-api.open-meteo.com https://api.frankfurter.app https://ipwho.is https://api.github.com https://ws.audioscrobbler.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

# The service worker must never be cached, or a stale one can pin
# clients to an old build — the failure mode behind the 2026-05-03
# incident.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── Scheduled Functions ──────────────────────────────────────────────
# push-dispatch sweeps the notifications_queue every minute. Cheap —
# the function returns immediately when the queue is empty.
[functions."push-dispatch"]
  schedule = "* * * * *"

# snapshot-ratings writes one rating snapshot per opted-in user per day.
# Powers the leaderboard's weekly-climb metric (current_ovr − snap_ovr).
# 03:00 UTC = low-traffic window.
[functions."snapshot-ratings"]
  schedule = "0 3 * * *"

# whoop-cron passively syncs each connected account's WHOOP data into
# their state. 06:00 UTC = overnight recovery/sleep are finalised and
# the app is closed, so the server-side merge can't race a client save.
[functions."whoop-cron"]
  schedule = "0 6 * * *"
